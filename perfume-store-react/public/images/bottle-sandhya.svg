<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 340" width="160" height="340">
  <defs>
    <linearGradient id="glass-sandhya" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3a2a24"/>
      <stop offset="55%" stop-color="#2a201b"/>
      <stop offset="100%" stop-color="#1c1512"/>
    </linearGradient>
    <linearGradient id="liquid-sandhya" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a8646a" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#a8646a" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="cap-sandhya" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e3c992"/>
      <stop offset="100%" stop-color="#c8983f"/>
    </linearGradient>
  </defs>

  <!-- cap -->
  <rect x="62" y="14" width="36" height="34" rx="3" fill="url(#cap-sandhya)"/>
  <rect x="62" y="14" width="36" height="6" rx="3" fill="#f4e3b8" opacity="0.5"/>

  <!-- neck -->
  <rect x="72" y="46" width="16" height="20" fill="#c8983f" opacity="0.85"/>

  <!-- body -->
  <rect x="30" y="66" width="100" height="250" rx="14" fill="url(#glass-sandhya)" stroke="#c8983f" stroke-width="1.2" stroke-opacity="0.6"/>

  <!-- liquid fill -->
  <rect x="36" y="150" width="88" height="158" rx="10" fill="url(#liquid-sandhya)"/>

  <!-- glass sheen -->
  <rect x="42" y="80" width="10" height="220" rx="5" fill="#f1e9db" opacity="0.08"/>

  <!-- label -->
  <rect x="46" y="175" width="68" height="52" rx="2" fill="#f1e9db" opacity="0.05" stroke="#c8983f" stroke-width="0.5" stroke-opacity="0.4"/>
  <text x="80" y="198" text-anchor="middle" fill="#e3c992" font-family="Georgia, serif" font-size="13" font-style="italic">Anokhi</text>
  <text x="80" y="214" text-anchor="middle" fill="#cabca3" font-family="Georgia, serif" font-size="7" letter-spacing="2">SANDHYA</text>
</svg>